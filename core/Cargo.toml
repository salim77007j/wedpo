[package]
name = "wedpo_core"
version = "1.0.0"
edition = "2021"
description = "Wedpo browser privacy core: adblock engine, tracker stripping, download risk scoring"
license = "GPL-3.0"

[lib]
name = "wedpo_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
adblock = "0.13.3"
url = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
