name: linux-build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config \
            libgl1-mesa-dev libfontconfig1-dev libfreetype6-dev \
            libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxi-dev \
            libxrender-dev libxcb1-dev libxcb-cursor-dev libxcb-glx0-dev \
            libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev \
            libxcb-randr0-dev libxcb-render-util0-dev libxcb-shape0-dev \
            libxcb-shm0-dev libxcb-sync-dev libxcb-xfixes0-dev \
            libxcb-xinerama0-dev libxcb-xkb-dev libxkbcommon-dev \
            libxkbcommon-x11-0-dev libxcomposite-dev libxdamage-dev \
            libxrandr-dev libxtst-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libnss3-dev libxss-dev \
            libatspi2.0-dev libegl1-mesa-dev

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Qt 6.8.3 (linux gcc)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          cache: true

      - name: Build Rust privacy core
        working-directory: core
        run: cargo build --release

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DRUST_CORE_DIR="${GITHUB_WORKSPACE}/core/target" \
            -DCMAKE_INSTALL_RPATH='$ORIGIN/../lib'

      - name: Build
        run: cmake --build build --parallel

      - name: Package bundle
        run: |
          QT_PREFIX=$(qmake -query QT_INSTALL_PREFIX)
          bash scripts/package-linux.sh build/app/wedpo-browser dist "$QT_PREFIX"
          chmod +x dist/wedpo-browser.sh

      - name: Smoke test (offscreen startup)
        run: |
          export QT_QPA_PLATFORM=offscreen
          timeout 12 dist/wedpo-browser.sh --smoke || code=$?
          echo "smoke exit: ${code:-0}"

      - name: Package tarball
        run: |
          tar -czf wedpo-linux-x64.tar.gz dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wedpo-linux-x64
          path: wedpo-linux-x64.tar.gz
          retention-days: 30
